424,468.758 L622.792,468.758 L622.792,302.297 L612.792,292.297 L424,292.297" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M612.792,292.297 L612.792,302.297 L622.792,302.297 L612.792,292.297" style="stroke:#181818;stroke-width:1;" fill="#FEFFDD"/><text x="430" y="309.364" fill="#000" font-size="13" textLength="177.792" font-family="Arial">Victim-selection algorithms</text><text x="430" y="324.497" fill="#000" font-size="13" textLength="163.979" font-family="Arial">are embedded directly in</text><text x="430" y="339.629" fill="#000" font-size="13" textLength="145.837" font-family="Arial">the simulation engine.</text><text x="430" y="354.762" fill="#000" font-size="13" font-family="Arial"> </text><text x="430" y="369.895" fill="#000" font-size="13" textLength="169.165" font-family="Arial">The engine branches on a</text><text x="430" y="385.028" fill="#000" font-size="13" textLength="172.117" font-family="Arial">policy name to choose the</text><text x="430" y="400.161" fill="#000" font-size="13" textLength="147.043" font-family="Arial">appropriate algorithm.</text><text x="430" y="415.293" fill="#000" font-size="13" font-family="Arial"> </text><text x="430" y="430.426" fill="#000" font-size="13" textLength="163.033" font-family="Arial">Adding another selection</text><text x="430" y="445.559" fill="#000" font-size="13" textLength="164.95" font-family="Arial">policy requires modifying</text><text x="430" y="460.692" fill="#000" font-size="13" textLength="64.257" font-family="Arial">this class.</text></g><g class="entity" data-qualified-name="GMN7" id="ent0008" data-source-line="51"><path d="M422,155.797 L422,256.594 A0,0 0 0 0 422,256.594 L624.727,256.594 A0,0 0 0 0 624.727,256.594 L624.727,165.797 L614.727,155.797 L528,155.797 L524,120.517 L520,155.797 L422,155.797 A0,0 0 0 0 422,155.797" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M614.727,155.797 L614.727,165.797 L624.727,165.797 L614.727,155.797" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="428" y="172.864" fill="#000" font-size="13" textLength="171.634" font-family="Arial">Candidate processes have</text><text x="428" y="187.997" fill="#000" font-size="13" textLength="181.727" font-family="Arial">priorities, resource holdings</text><text x="428" y="203.129" fill="#000" font-size="13" textLength="157.523" font-family="Arial">and execution progress.</text><text x="428" y="218.262" fill="#000" font-size="13" font-family="Arial"> </text><text x="428" y="233.395" fill="#000" font-size="13" textLength="160.386" font-family="Arial">The selection algorithms</text><text x="428" y="248.528" fill="#000" font-size="13" textLength="171.698" font-family="Arial">evaluate these properties.</text></g><!--link SimulationEngine to Process--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk3" data-source-line="34" data-link-type="dependency"><path d="M185,172.407 C185,130.757 185,82.297 185,82.297 C185,82.297 381.98,82.297 473.9,82.297" style="stroke:#444;stroke-width:1;stroke-dasharray:7,7;" fill="none" id="SimulationEngine-to-Process" codeLine="34"/><polygon points="478.9,82.297,469.9,78.297,473.9,82.297,469.9,86.297,478.9,82.297" fill="#444" style="stroke:#444;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="103.89" y="95.364" fill="#000" font-size="13" textLength="182.736" font-family="Arial">evaluates candidate victims</text></g><!--link SimulationEngine to GMN4--><g class="link" data-entity-1="ent0001" data-entity-2="ent0005" id="lnk6" data-source-line="37" data-link-type="association"><path d="M362.2,273.297 C444.35,273.297 524,273.297 524,273.297 C524,273.297 524,280.847 524,291.937" style="stroke:#444;stroke-width:1;stroke-dasharray:7,7;" fill="none" id="SimulationEngine-GMN4"/></g><g class="legend" data-source-line="59"><rect x="199.449" y="489.758" width="233.829" height="205.563" fill="none" style="stroke:#000;stroke-width:1;"/><text x="204.449" y="507.753" fill="#000" font-size="14" textLength="202.706" font-family="Arial">BEFORE STRATEGY PATTERN</text><text x="204.449" y="524.05" fill="#000" font-size="14" font-family="Arial"> </text><text x="204.449" y="540.347" fill="#000" font-size="14" textLength="209.385" font-family="Arial">Conceptual design illustrating</text><text x="204.449" y="556.644" fill="#000" font-size="14" textLength="223.829" font-family="Arial">tightly coupled victim selection.</text><text x="204.449" y="572.94" fill="#000" font-size="14" font-family="Arial"> </text><text x="204.449" y="589.237" fill="#000" font-size="14" textLength="213.172" font-family="Arial">The private selection methods</text><text x="204.449" y="605.534" fill="#000" font-size="14" textLength="204.791" font-family="Arial">shown here are hypothetical,</text><text x="204.449" y="621.831" fill="#000" font-size="14" textLength="184.522" font-family="Arial">not verified Java methods.</text><text x="204.449" y="638.128" fill="#000" font-size="14" font-family="Arial"> </text><text x="204.449" y="654.425" fill="#000" font-size="14" textLength="62.508" font-family="Arial">Problem:</text><text x="204.449" y="670.722" fill="#000" font-size="14" textLength="210.116" font-family="Arial">Selection logic and simulation</text><text x="204.449" y="687.019" fill="#000" font-size="14" textLength="198.789" font-family="Arial">orchestration are combined.</text></g><g class="caption" data-source-line="2"><text x="85.032" y="722.315" fill="#000" font-size="14" textLength="462.663" font-family="Arial">Hypothetical design comparison - Not the current implementation</text></g><?plantuml-src TLJBRjim4BphAnR89K5Zew-J4GHmNATf3wbX6mLwfCcrH8JYgYHbLotwxrsIYgmygeD0SidPsTaXWmu6uRkMGTUmGOCy80iJkC4zEOHDS29WsS5AX83E5b8qQSTTrr2eC6Wf32ZqkhGWgMw4qpu1t5C0tW2oTGvj05qt1ciUYNY-A0pkUGE1qsKLG6cNKnU5Vz2MOKGDEo4VIaUjLGiovE1OwO2ZkCAzQ4su9HlkHOqmTrgOr-CR_HlXtOTHq5T2qL7R4lR2-35ioYZ9MNJmThGkZV1-7eBJkpRW5qaseOwt66qnT0q2kL3HA31tZewvYhEFwIkU8yEV0k3cMSbdj-cB4N8AtLC8W5XRl_O-VSNVeiXm6rst9eczj2NpWgkh9qtxb9fsV