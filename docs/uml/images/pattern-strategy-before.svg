<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="CLASS" style="width:639px;height:733px;background:#FFFFFF;" width="639px" height="733px" viewBox="0 0 639 733" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.9?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="1"><text x="149.546" y="22.995" fill="#000" font-size="14" textLength="333.635" font-weight="700" font-family="Arial">Victim Selection - Before Strategy Pattern</text></g><!--class SimulationEngine--><g class="entity" data-qualified-name="SimulationEngine" id="ent0001" data-source-line="21"><rect x="7" y="172.797" width="354.596" height="116.797" fill="#FFF" style="stroke:#444;stroke-width:0.5;"/><ellipse cx="108.544" cy="192.93" rx="10" ry="10" fill="#ADD1B2" style="stroke:#181818;stroke-width:1;"/><path d="M110.404,197.164 Q109.966,197.383 109.466,197.492 Q108.982,197.617 108.451,197.617 Q106.529,197.617 105.513,196.352 Q104.513,195.086 104.513,192.695 Q104.513,190.305 105.513,189.039 Q106.529,187.773 108.451,187.773 Q108.982,187.773 109.482,187.898 Q109.982,188.008 110.404,188.242 L110.404,190.32 Q109.919,189.883 109.466,189.68 Q109.013,189.461 108.529,189.461 Q107.513,189.461 106.982,190.289 Q106.451,191.102 106.451,192.695 Q106.451,194.305 106.982,195.117 Q107.513,195.93 108.529,195.93 Q109.013,195.93 109.466,195.727 Q109.919,195.523 110.404,195.07 L110.404,197.164 Z " fill="#000"/><text x="125.544" y="189.864" fill="#000" font-size="13" textLength="147.507" font-style="italic" font-family="Arial">«Hypothetical Design»</text><text x="142.397" y="204.997" fill="#222" font-size="13" textLength="113.801" font-family="Arial">SimulationEngine</text><line x1="8" y1="213.063" x2="360.596" y2="213.063" style="stroke:#444;stroke-width:0.5;"/><text x="13" y="229.129" fill="#000" font-size="13" textLength="342.596" font-family="Arial">+recover(policyName: String,