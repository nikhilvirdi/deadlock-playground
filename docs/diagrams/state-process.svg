<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="STATE" style="width:1469px;height:570px;background:#FFFFFF;" width="1469px" height="570px" viewBox="0 0 1469 570" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.9?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="17"><text x="602.929" y="22.995" fill="#000" font-size="14" textLength="256.765" font-weight="700" font-family="Arial">Process Lifecycle (ProcessState)</text></g><rect x="702.5" y="161.297" width="66.889" height="40" fill="#DAE8FC" style="stroke:#475569;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="707.5" y="185.451" fill="#000" font-size="12" textLength="56.889" font-family="Arial">RUNNING</text><rect x="545.5" y="344.297" width="62.758" height="40" fill="#FFF2CC" style="stroke:#475569;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="550.5" y="368.451" fill="#000" font-size="12" textLength="52.758" font-family="Arial">WAITING</text><rect x="977" y="344.297" width="83.834" height="40" fill="#D5E8D4" style="stroke:#475569;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="982" y="368.451" fill="#000" font-size="12" textLength="73.834" font-family="Arial">COMPLETED</text><rect x="7" y="161.297" width="88.48" height="40" fill="#F8D7DA" style="stroke:#475569;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="12" y="185.451" fill="#000" font-size="12" textLength="78.48" font-family="Arial">TERMINATED</text><g class="start_entity" data-qualified-name=".start." id="ent0005" data-source-line="24"><ellipse cx="736" cy="53.297" rx="10" ry="10" fill="#222" style="stroke:#222;stroke-width:1;"/></g><g class="end_entity" data-qualified-name=".end." id="ent0019" data-source-line="44"><ellipse cx="799" cy="495.797" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="799" cy="495.797" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/></g><g class="entity" data-qualified-name="GMN22" id="ent0023" data-source-line="48"><path d="M394.5,471.797 L394.5,520.211 L697.225,520.211 L697.225,481.797 L687.225,471.797 L394.5,471.797" style="stroke:#64748B;stroke-width:0.5;" fill="#F1F5F9"/><path d="M687.225,471.797 L687.225,481.797 L697.225,481.797 L687.225,471.797" style="stroke:#64748B;stroke-width:1;" fill="#F1F5F9"/><text x="400.5" y="487.007" fill="#000" font-size="11" textLength="281.725" font-family="Arial">deadlocked is a separate boolean set by detection,</text><text x="400.5" y="499.812" fill="#000" font-size="11" textLength="276.418" font-family="Arial">not a ProcessState value. A WAITING process may</text><text x="400.5" y="512.617" fill="#000" font-size="11" textLength="147.893" font-family="Arial">or may not be deadlocked.</text></g><g class="entity" data-qualified-name="GMN25" id="ent0026" data-source-line="54"><path d="M900,465.297 L900,526.516 L1199.647,526.516 L1199.647,475.297 L1189.647,465.297 L900,465.297" style="stroke:#64748B;stroke-width:0.5;" fill="#F1F5F9"/><path d="M1189.647,465.297 L1189.647,475.297 L1199.647,475.297 L1189.647,465.297" style="stroke:#64748B;stroke-width:1;" fill="#F1F5F9"/><text x="906" y="480.507" fill="#000" font-size="11" textLength="278.647" font-family="Arial">COMPLETED and TERMINATED are terminal for the</text><text x="906" y="493.312" fill="#000" font-size="11" textLength="210.219" font-family="Arial">current execution. Reset and scenario</text><text x="906" y="506.117" fill="#000" font-size="11" textLength="264.317" font-family="Arial">reconfiguration replace the simulation; they are</text><text x="906" y="518.921" fill="#000" font-size="11" textLength="131.823" font-family="Arial">not lifecycle transitions.</text></g><!--link *start* to RUNNING--><g class="link" data-entity-1="ent0005" data-entity-2="ent0001" id="lnk6" data-source-line="24" data-link-type="dependency"><path d="M736,63.357 C736,83.677 736,128.237 736,155.867" style="stroke:#475569;stroke-width:1;" fill="none" id="*start*-to-RUNNING"/><polygon points="736,160.867,740,151.867,736,155.867,732,151.867,736,160.867" fill="#475569" style="stroke:#475569;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="737" y="116.364" fill="#000" font-size="13" textLength="123.989" font-family="Arial">process configured</text></g><!--link RUNNING to RUNNING--><g class="link" data-entity-1="ent0001" data-entity-2="ent0001" id="lnk7" data-source-line="27" data-link-type="dependency"><path d="M769.51,172.257 C810.74,165.197 859.5,168.217 859.5,181.297 C859.5,194.377 815.668,198.241 774.438,191.181" style="stroke:#475569;stroke-width:1;" fill="none" id="RUNNING-to-RUNNING"/><polygon points="769.51,190.337,777.706,195.798,774.438,191.181,779.056,187.913,769.51,190.337" fill="#475569" style="stroke:#475569;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="865.5" y="178.364" fill="#000" font-size="13" textLength="238.697" font-family="Arial">request granted or release succeeds</text><text x="872.854" y="193.497" fill="#000" font-size="13" textLength="223.99" font-family="Arial">[more scripted operations remain]</text></g><!--link RUNNING to WAITING--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk8" data-source-line="30" data-link-type="dependency"><path d="M702.4,183.077 C625.27,185.657 439.25,196.587 401,242.297 C383.32,263.427 384.91,281.927 401,304.297 C433.94,350.077 499.097,360.566 540.187,362.796" style="stroke:#475569;stroke-width:1;" fill="none" id="RUNNING-to-WAITING"/><polygon points="545.18,363.067,536.41,358.585,540.187,362.796,535.976,366.573,545.18,363.067" fill="#475569" style="stroke:#475569;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="425.569" y="255.364" fill="#000" font-size="13" textLength="174.142" font-family="Arial">request cannot be granted</text><text x="402" y="270.497" fill="#000" font-size="13" textLength="221.279" font-family="Arial">[capacity unavailable, or Banker's</text><text x="436.769" y="285.629" fill="#000" font-size="13" textLength="151.741" font-family="Arial">finds allocation unsafe]</text><text x="431.958" y="300.762" fill="#000" font-size="13" textLength="161.364" font-family="Arial">/ record pending request</text></g><!--reverse link RUNNING to WAITING--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk10" data-source-line="32" data-link-type="dependency"><path d="M720.091,205.402 C702.771,230.122 673.55,270.097 642,304.297 C628.88,318.527 612.78,333.157 599.88,344.287" style="stroke:#475569;stroke-width:1;" fill="none" id="RUNNING-backto-WAITING"/><polygon points="722.96,201.307,714.52,206.382,720.091,205.402,721.072,210.973,722.96,201.307" fill="#475569" style="stroke:#475569;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="712.894" y="270.364" fill="#000" font-size="13" textLength="184.203" font-family="Arial">(a) pending request granted</text><text x="693" y="285.497" fill="#000" font-size="13" textLength="223.99" font-family="Arial">[more scripted operations remain]</text></g><!--reverse link RUNNING to WAITING--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk12" data-source-line="34" data-link-type="dependency"><path d="M774.844,188.177 C827.154,196.767 918.71,215.137 939,242.297 C955.49,264.367 956.85,283.307 939,304.297 C896.62,354.147 689.01,361.977 608.76,363.137" style="stroke:#475569;stroke-width:1;" fill="none" id="RUNNING-backto-WAITING-1"/><polygon points="769.91,187.367,778.143,192.772,774.844,188.177,779.439,184.878,769.91,187.367" fill="#475569" style="stroke:#475569;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="960.458" y="255.364" fill="#000" font-size="13" textLength="232.515" font-family="Arial">(b) Preempt recovery selects victim</text><text x="952" y="270.497" fill="#000" font-size="13" textLength="249.431" font-family="Arial">/ return holdings, reset script position,</text><text x="966.562" y="285.629" fill="#000" font-size="13" textLength="220.308" font-family="Arial">executed count, pending request,</text><text x="1010.671" y="300.762" fill="#000" font-size="13" textLength="132.088" font-family="Arial">and deadlocked flag</text></g><!--link RUNNING to COMPLETED--><g class="link" data-entity-1="ent0001" data-entity-2="ent0003" id="lnk13" data-source-line="37" data-link-type="dependency"><path d="M769.76,183.907 C875.31,189.277 1193.85,208.207 1224,242.297 C1242.26,262.937 1240.57,282.287 1224,304.297 C1204.45,330.257 1120.295,347.553 1066.205,356.363" style="stroke:#475569;stroke-width:1;" fill="none" id="RUNNING-to-COMPLETED"/><polygon points="1061.27,357.167,1070.796,359.668,1066.205,356.363,1069.51,351.772,1061.27,357.167" fill="#475569" style="stroke:#475569;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="1238" y="270.364" fill="#000" font-size="13" textLength="215.624" font-family="Arial">final scripted operation succeeds</text><text x="1253.149" y="285.497" fill="#000" font-size="13" textLength="185.326" font-family="Arial">/ release remaining holdings</text></g><!--link WAITING to COMPLETED--><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" id="lnk14" data-source-line="38" data-link-type="dependency"><path d="M608.79,364.297 C686.97,364.297 883.68,364.297 971.78,364.297" style="stroke:#475569;stroke-width:1;" fill="none" id="WAITING-to-COMPLETED"/><polygon points="976.78,364.297,967.78,360.297,971.78,364.297,967.78,368.297,976.78,364.297" fill="#475569" style="stroke:#475569;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="685.25" y="342.364" fill="#000" font-size="13" textLength="215.522" font-family="Arial">(c) final pending request granted</text><text x="700.348" y="357.497" fill="#000" font-size="13" textLength="185.326" font-family="Arial">/ release remaining holdings</text></g><!--reverse link TERMINATED to RUNNING--><g class="link" data-entity-1="ent0004" data-entity-2="ent0001" id="lnk16" data-source-line="41" data-link-type="dependency"><path d="M100.15,181.297 C227.53,181.297 588.77,181.297 702.14,181.297" style="stroke:#475569;stroke-width:1;" fill="none" id="TERMINATED-backto-RUNNING"/><polygon points="95.15,181.297,104.15,185.297,100.15,181.297,104.15,177.297,95.15,181.297" fill="#475569" style="stroke:#475569;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="312.178" y="144.364" fill="#000" font-size="13" textLength="173.862" font-family="Arial">scripted operation violates</text><text x="310.838" y="159.497" fill="#000" font-size="13" textLength="176.541" font-family="Arial">an enabled prevention rule</text><text x="289.25" y="174.629" fill="#000" font-size="13" textLength="219.718" font-family="Arial">/ release holdings, stop execution</text></g><!--reverse link TERMINATED to WAITING--><g class="link" data-entity-1="ent0004" data-entity-2="ent0002" id="lnk18" data-source-line="42" data-link-type="dependency"><path d="M52.399,206.467 C54.879,233.957 63.31,279.027 95,304.297 C164.87,360.017 449.57,363.917 545.37,363.607" style="stroke:#475569;stroke-width:1;" fill="none" id="TERMINATED-backto-WAITING"/><polygon points="51.95,201.487,48.775,210.81,52.399,206.467,56.742,210.091,51.95,201.487" fill="#475569" style="stroke:#475569;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="120.445" y="262.864" fill="#000" font-size="13" textLength="221.654" font-family="Arial">Terminate recovery selects victim</text><text x="96" y="277.997" fill="#000" font-size="13" textLength="270.543" font-family="Arial">/ release holdings, clear pending request,</text><text x="183.179" y="293.129" fill="#000" font-size="13" textLength="96.186" font-family="Arial">stop execution</text></g><!--link COMPLETED to *end*--><g class="link" data-entity-1="ent0003" data-entity-2="ent0019" id="lnk20" data-source-line="44" data-link-type="dependency"><path d="M986.54,384.407 C935.38,414.517 843.009,468.89 812.669,486.75" style="stroke:#4